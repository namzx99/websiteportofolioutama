<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - Faiz Khoirul Anam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --dark-bg: #0f0f1e;
            --light-text: #e0e0e0;
            --white: #ffffff;
            --accent-color: #f093fb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            color: var(--light-text);
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.8s ease;
        }

        .loading-icon-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-rings {
            position: absolute;
            width: 200px;
            height: 200px;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: var(--primary-color);
            border-right-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 2s linear infinite;
            top: 0;
            left: 0;
        }

        .ring:nth-child(2) {
            width: 85%;
            height: 85%;
            border-top-color: var(--secondary-color);
            border-right-color: var(--primary-color);
            animation: spin 3s linear infinite reverse;
            top: 7.5%;
            left: 7.5%;
        }

        .ring:nth-child(3) {
            width: 65%;
            height: 65%;
            border-top-color: var(--accent-color);
            border-right-color: var(--secondary-color);
            animation: spin 4s linear infinite;
            top: 17.5%;
            left: 17.5%;
        }

        .loading-icon {
            font-size: 100px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s ease-in-out infinite;
            z-index: 10;
            position: relative;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .loading-text {
            margin-bottom: 1.5rem;
        }

        .loading-text h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-text p {
            font-size: 1.1rem;
            color: var(--light-text);
            margin-bottom: 1rem;
        }

        .loading-subtitle {
            font-size: 0.95rem;
            color: rgba(224, 224, 224, 0.6);
            margin-bottom: 2rem;
        }

        .music-visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 0.5rem;
            height: 60px;
            margin: 2rem 0;
        }

        .bar {
            width: 6px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: 3px;
            animation: wave 0.8s ease-in-out infinite;
            transition: height 0.15s ease;
        }

        .bar:nth-child(1) { animation-delay: 0s; height: 20px; }
        .bar:nth-child(2) { animation-delay: 0.1s; height: 35px; }
        .bar:nth-child(3) { animation-delay: 0.2s; height: 50px; }
        .bar:nth-child(4) { animation-delay: 0.3s; height: 45px; }
        .bar:nth-child(5) { animation-delay: 0.2s; height: 40px; }
        .bar:nth-child(6) { animation-delay: 0.1s; height: 30px; }
        .bar:nth-child(7) { animation-delay: 0s; height: 25px; }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 50px; }
        }

        .loading-dots {
            margin: 1.5rem 0;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 0.3rem;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.8;
            }
            40% {
                transform: translateY(-15px);
                opacity: 1;
            }
        }

        .progress-container {
            background: rgba(102, 126, 234, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            margin-top: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 3px;
            animation: progressAnimation 3s ease-in-out;
        }

        @keyframes progressAnimation {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .progress-text {
            font-size: 0.85rem;
            text-align: center;
            color: var(--light-text);
        }

        .music-info {
            margin-top: 1.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(240, 147, 251, 0.1));
            border-radius: 8px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .music-info-title {
            font-size: 0.85rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .music-info-song {
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
            color: var(--white);
        }

        .music-info-artist {
            font-size: 0.9rem;
            color: var(--light-text);
        }

        @media (max-width: 480px) {
            .loading-container {
                max-width: 90%;
            }

            .loading-text h1 {
                font-size: 1.5rem;
            }

            .loading-icon {
                font-size: 70px;
            }

            .loading-rings {
                width: 80px;
                height: 80px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-icon-container">
            <i class="fas fa-user-circle loading-icon"></i>
            <div class="loading-rings">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
        </div>

        <div class="loading-text">
            <h1>Faiz Khoirul Anam</h1>
            <p>Welcome To My Portofolio!</p>
            <p class="loading-subtitle">Waiting Loading Portofolio...</p>
        </div>

        <div class="music-visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div class="progress-text">Loading Portofolio...</div>
        </div>

        <div class="music-info">
            <div class="music-info-title"><i class="fas fa-music"></i> Playing</div>
            <div class="music-info-song">Portofolio</div>
            <div class="music-info-artist">by Faiz Khoirul Anam</div>
        </div>
    </div>
    
    <audio id="loadingAudio" autoplay loop>
        <button id="enterBtn">Enter Portfolio</button>
        <source src="asep.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Animate visualizer bars
        function animateBars() {
            const bars = document.querySelectorAll('.bar');
            bars.forEach((bar, index) => {
                const randomHeight = Math.random() * 40 + 10;
                bar.style.setProperty('height', randomHeight + 'px');
            });
        }

        // Start bar animation
        setInterval(() => {
            animateBars();
        }, 150);

        // Try to play background music
        const audio = document.getElementById('loadingAudio');
        if (audio) 
            audio.volume = 1.0;
            
        audio.play()
.then(() => {
    console.log("BERHASIL PLAY");
})
.catch(err => {
    console.log("GAGAL PLAY:", err);
});

            // Auto play dengan fallback
            setTimeout(() => {
                    window.location.href = 'index.html';
                }, 6000);

        // Handle user interaction untuk audio
      document.getElementById('enterBtn').addEventListener('click', () => {

                audio.play().catch(err => {
                    console.log('Audio playback prevented:', err);
                });
            }
        );
    </script>
</body>
</html>
