<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - Faiz Khoirul Anam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --dark-bg: #0f0f1e;
            --light-text: #e0e0e0;
            --white: #ffffff;
            --accent-color: #f093fb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            color: var(--light-text);
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.8s ease;
        }

        /* Sembunyikan konten loading utama terlebih dahulu */
        #mainLoading {
            display: none;
        }

        /* Style untuk Tombol Masuk Pertama Kali */
        .welcome-screen {
            text-align: center;
        }

        .enter-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1.5rem;
        }

        .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .loading-icon-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-rings {
            position: absolute;
            width: 200px;
            height: 200px;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: var(--primary-color);
            border-right-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 2s linear infinite;
            top: 0;
            left: 0;
        }

        .ring:nth-child(2) {
            width: 85%;
            height: 85%;
            border-top-color: var(--secondary-color);
            border-right-color: var(--primary-color);
            animation: spin 3s linear infinite reverse;
            top: 7.5%;
            left: 7.5%;
        }

        .ring:nth-child(3) {
            width: 65%;
            height: 65%;
            border-top-color: var(--accent-color);
            border-right-color: var(--secondary-color);
            animation: spin 4s linear infinite;
            top: 17.5%;
            left: 17.5%;
        }

        .loading-icon {
            font-size: 100px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s ease-in-out infinite;
            z-index: 10;
            position: relative;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .loading-text {
            margin-bottom: 1.5rem;
        }

        .loading-text h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-text p {
            font-size: 1.1rem;
            color: var(--light-text);
            margin-bottom: 1rem;
        }

        .loading-subtitle {
            font-size: 0.95rem;
            color: rgba(224, 224, 224, 0.6);
            margin-bottom: 2rem;
        }

        .music-visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 0.5rem;
            height: 60px;
            margin: 2rem 0;
        }

        .bar {
            width: 6px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .loading-dots {
            margin: 1.5rem 0;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 0.3rem;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.8; }
            40% { transform: translateY(-15px); opacity: 1; }
        }

        .progress-container {
            background: rgba(102, 126, 234, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            margin-top: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 3px;
            width: 0%;
        }

        .progress-text {
            font-size: 0.85rem;
            text-align: center;
            color: var(--light-text);
        }

        .music-info {
            margin-top: 1.5rem;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(240, 147, 251, 0.1));
            border-radius: 8px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .music-info-title {
            font-size: 0.85rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .music-info-song {
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
            color: var(--white);
        }

        .music-info-artist {
            font-size: 0.9rem;
            color: var(--light-text);
        }

        @media (max-width: 480px) {
            .loading-container { max-width: 90%; }
            .loading-text h1 { font-size: 1.5rem; }
            .loading-icon { font-size: 70px; }
            .loading-rings { width: 80px; height: 80px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="welcomeScreen" class="welcome-screen">
        <div class="loading-text">
            <h1>Hello Guys</h1>
            <p>Welcome To My Portfolio!</p>
        </div>
        <button id="enterBtn" class="enter-btn">Open Portfolio <i class="fas fa-play"></i></button>
    </div>

    <div id="mainLoading" class="loading-container">
        <div class="loading-icon-container">
            <i class="fas fa-user-circle loading-icon"></i>
            <div class="loading-rings">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
        </div>

        <div class="loading-text">
            <h1>Faiz Khoirul Anam</h1>
            <p>Welcome To My Portfolio!</p>
            <p class="loading-subtitle">Loading Portfolio, please wait...</p>
        </div>

        <div class="music-visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
            <div class="progress-text">Loading Portfolio...</div>
        </div>

        <div class="music-info">
            <div class="music-info-title"><i class="fas fa-music"></i> Playing</div>
            <div class="music-info-song">Portfolio Background Track</div>
            <div class="music-info-artist">by Faiz Khoirul Anam</div>
        </div>
    </div>
    
    <audio id="loadingAudio" loop>
        <source src="asep.mp3" type="audio/mpeg">
    </audio>

    <script>
        const welcomeScreen = document.getElementById('welcomeScreen');
        const mainLoading = document.getElementById('mainLoading');
        const enterBtn = document.getElementById('enterBtn');
        const audio = document.getElementById('loadingAudio');
        const progressBar = document.getElementById('progressBar');

        // Fungsi mengacak tinggi visualizer musik
        function animateBars() {
            const bars = document.querySelectorAll('.bar');
            bars.forEach((bar) => {
                const randomHeight = Math.random() * 45 + 10;
                bar.style.height = randomHeight + 'px';
            });
        }

        // Jalankan aksi setelah tombol diklik (Interaksi User Terpenuhi)
        enterBtn.addEventListener('click', () => {
            // 1. Sembunyikan tombol enter, tampilkan visualisasi loading
            welcomeScreen.style.display = 'none';
            mainLoading.style.display = 'block';

            // 2. Putar Audio
            if (audio) {
                audio.volume = 1.0;
                audio.play()
                    .then(() => console.log("AUDIO BERHASIL BERPUTAR"))
                    .catch(err => console.log("AUDIO GAGAL:", err));
            }

            // 3. Mulai animasi visualizer musik
            setInterval(animateBars, 150);

            // 4. Jalankan animasi Progress Bar secara mulus (CSS transition)
            progressBar.style.transition = 'width 6s linear';
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 100);

            // 5. Redirect ke index.html setelah 6 detik
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 6000);
        });
    </script>
</body>
</html>
