<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Faiz Khoirul Anam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --dark-bg: #0f0f1e;
            --light-text: #e0e0e0;
            --white: #ffffff;
            --accent-color: #f093fb;
            --error-color: #ff6b6b;
            --success-color: #51cf66;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            color: var(--light-text);
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: rgba(15, 15, 30, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            padding: 3rem 2rem;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.15);
            animation: fadeInUp 0.6s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: var(--light-text);
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--light-text);
            font-size: 0.95rem;
        }

        .form-group label i {
            margin-right: 0.5rem;
            color: var(--primary-color);
            width: 20px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: var(--primary-color);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.8rem;
            background: rgba(102, 126, 234, 0.1);
            border: 1.5px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            color: var(--white);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(224, 224, 224, 0.5);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(102, 126, 234, 0.15);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
        }

        .form-group input.error {
            border-color: var(--error-color);
            background: rgba(255, 107, 107, 0.1);
        }

        .form-group input.error:focus {
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.2);
        }

        .error-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
        }

        .error-message i {
            font-size: 1rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1.5rem 0;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .remember-me label {
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--light-text);
            margin: 0;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        .login-btn i {
            font-size: 1.1rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(102, 126, 234, 0.2);
        }

        .divider span {
            color: var(--light-text);
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link a:hover {
            color: var(--accent-color);
            transform: translateX(-3px);
        }

        .success-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--success-color);
            font-size: 0.9rem;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(81, 207, 102, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(81, 207, 102, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-message.show {
            opacity: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-icon {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-lock-open"></i>
            </div>
            <h1>Faiz Khoirul Anam</h1>
            <p>Access Portal</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email Address
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-at input-icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required
                    >
                </div>
                <div class="error-message" id="emailError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="emailErrorText"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-key"></i>
                    Password
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>
                <div class="error-message" id="passwordError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="passwordErrorText"></span>
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me on this device</label>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login to Dashboard</span>
            </button>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <span>Login successful! Redirecting...</span>
            </div>

            <div class="divider">
                <span>Professional Portal</span>
            </div>
        </form>

        <div class="back-link">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i>
                Back to Portfolio
            </a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = loginForm.querySelector('.login-btn');
        const emailError = document.getElementById('emailError');
        const emailErrorText = document.getElementById('emailErrorText');
        const passwordError = document.getElementById('passwordError');
        const passwordErrorText = document.getElementById('passwordErrorText');
        const successMessage = document.getElementById('successMessage');

        // Valid email - only this email can login
        const VALID_EMAIL = 'xv10z@gmail.com';
        // Password must be at least 6 characters
        const MIN_PASSWORD_LENGTH = 6;

        // Clear error messages on input
        emailInput.addEventListener('input', () => {
            emailError.classList.remove('show');
            emailInput.classList.remove('error');
        });

        passwordInput.addEventListener('input', () => {
            passwordError.classList.remove('show');
            passwordInput.classList.remove('error');
        });

        // Form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Reset error states
            emailError.classList.remove('show');
            passwordError.classList.remove('show');
            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');
            successMessage.classList.remove('show');

            let hasError = false;

            // Validate email
            if (!email) {
                emailErrorText.textContent = 'Email is required';
                emailError.classList.add('show');
                emailInput.classList.add('error');
                hasError = true;
            } else if (email !== VALID_EMAIL) {
                emailErrorText.textContent = 'Invalid email address';
                emailError.classList.add('show');
                emailInput.classList.add('error');
                hasError = true;
            }

            // Validate password
            if (!password) {
                passwordErrorText.textContent = 'Password is required';
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                hasError = true;
            } else if (password.length < MIN_PASSWORD_LENGTH) {
                passwordErrorText.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
                passwordInput.classList.add('error');
                hasError = true;
            }

            if (hasError) {
                return;
            }

            // Show loading state
            loginBtn.classList.add('loading');
            const originalHTML = loginBtn.innerHTML;
            loginBtn.innerHTML = '<i class="fas fa-spinner spinner"></i><span>Verifying...</span>';

            // Simulate login process
            setTimeout(() => {
                // Successful login
                successMessage.classList.add('show');
                
                // Store login info
                if (document.getElementById('remember').checked) {
                    localStorage.setItem('faizLogged', 'true');
                    localStorage.setItem('faizEmail', email);
                }

                // Redirect to loading screen after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'loading.html';
                }, 1500);
            }, 1500);
        });

        // Check if user was previously logged in
        window.addEventListener('load', () => {
            if (localStorage.getItem('faizLogged') === 'true') {
                const email = localStorage.getItem('faizEmail');
                emailInput.value = email;
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
